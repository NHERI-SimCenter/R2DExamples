summary: |
  This example is similar to example 2, the main difference being that it includes uncertainty in the asset inventory. The input for the asset contains information for **multiple possible worlds**. The example uses ground motions from the 2018 earthquake in Anchorage, AK, to characterize the response of buildings with an idealized MDOF building model through story-level Engineering Demand Parameters (EDP). Exploiting the refinement in EDPs, a HAZUS-based story-level assessment is employed to evaluate the performance of 5 buildings.

#<p>Tags: (Recorded ground motions | MDOF Building Response | HAZUS story-level D&L | Multiple Worlds)<p>

#[4k buildings in inventory with 5 selected for analysis]

difficulty: 1

